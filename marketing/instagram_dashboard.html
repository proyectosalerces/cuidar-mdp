<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuidar MdP — Grilla de Publicaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0d7377;
      --teal-dark: #094b4e;
      --teal-light: #14919b;
      --gold: #c8a45a;
      --gold-light: #e0c87a;
      --bg: #0a0f14;
      --bg-card: #131c26;
      --bg-elevated: #1a2733;
      --bg-hover: #1f3040;
      --text: #e8ecf1;
      --text-muted: #8295a8;
      --border: #243040;
      --success: #22c55e;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --radius: 0.75rem;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .hero {
      background: linear-gradient(135deg, #061a1c 0%, var(--teal-dark) 50%, #0a2e30 100%);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      border-bottom: 2px solid var(--gold);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(200,164,90,0.06) 0%, transparent 50%);
    }
    .hero h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
      position: relative;
    }
    .hero .sub {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      position: relative;
    }
    .hero .badges {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
      position: relative;
    }
    .hero .badge {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .hero .badge strong {
      color: var(--gold);
    }

    /* ── TOOLBAR ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,15,20,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .view-toggle {
      display: flex;
      gap: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .view-toggle button {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0.45rem 0.9rem;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-toggle button.active {
      background: var(--teal);
      color: #fff;
    }
    .view-toggle button:hover:not(.active) {
      background: var(--bg-hover);
    }

    .week-pills {
      display: flex;
      gap: 0.3rem;
      overflow-x: auto;
      flex: 1;
      justify-content: center;
    }
    .week-pills button {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .week-pills button:hover,
    .week-pills button.active {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }

    /* ── CONTENT ── */
    .content { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    /* ── GRID VIEW ── */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .grid-cell {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      cursor: pointer;
      border-radius: 2px;
    }
    .grid-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s, filter 0.3s;
    }
    .grid-cell:hover img {
      transform: scale(1.05);
      filter: brightness(0.6);
    }
    .grid-cell .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
      padding: 0.5rem;
      text-align: center;
    }
    .grid-cell:hover .overlay { opacity: 1; }
    .grid-cell .overlay .num {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--gold);
    }
    .grid-cell .overlay .theme {
      font-size: 0.7rem;
      color: #fff;
      margin-top: 0.2rem;
    }
    .grid-cell .overlay .day-badge {
      font-size: 0.6rem;
      background: var(--teal);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      margin-top: 0.4rem;
      font-weight: 600;
    }
    .grid-cell .week-label {
      position: absolute;
      top: 0.4rem;
      left: 0.4rem;
      background: rgba(0,0,0,0.7);
      color: var(--gold);
      font-size: 0.55rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    /* ── CALENDAR VIEW ── */
    .calendar-view { display: none; }
    .cal-week {
      margin-bottom: 2rem;
    }
    .cal-week-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }
    .cal-week-header .week-num {
      background: var(--teal);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
    }
    .cal-week-header .week-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
    }
    .cal-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .cal-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .cal-card:hover {
      border-color: var(--teal);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .cal-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }
    .cal-card-body {
      padding: 0.8rem;
    }
    .cal-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .cal-card-top .post-num {
      font-weight: 800;
      font-size: 0.75rem;
      color: var(--gold);
    }
    .cal-card-top .day-tag {
      font-size: 0.65rem;
      background: rgba(13,115,119,0.2);
      color: var(--teal-light);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .cal-card .theme-label {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .cal-card .caption-preview {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-height: 4.5em;
      overflow: hidden;
      margin-bottom: 0.6rem;
    }
    .cal-card .btn-row {
      display: flex;
      gap: 0.4rem;
    }
    .cal-card .btn-row button {
      flex: 1;
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cal-card .btn-row button:hover {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }
    .cal-card .btn-row button.copied {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    /* ── LIST VIEW ── */
    .list-view { display: none; }
    .list-item {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 1.2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }
    .list-item:hover { border-color: var(--teal); }
    .list-item img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }
    .list-item-body { min-width: 0; }
    .list-item-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .list-item-header .num { font-weight: 800; font-size: 0.8rem; color: var(--gold); }
    .list-item-header .theme { font-size: 0.85rem; font-weight: 600; }
    .list-item-header .day {
      font-size: 0.65rem;
      background: rgba(13,115,119,0.2);
      color: var(--teal-light);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
      margin-left: auto;
    }
    .list-item .caption-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 0.5rem;
    }
    .list-item .tags-text {
      font-size: 0.75rem;
      color: var(--teal-light);
      margin-bottom: 0.5rem;
    }
    .list-item .btn-row { display: flex; gap: 0.4rem; }
    .list-item .btn-row button {
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .list-item .btn-row button:hover {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }
    .list-item .btn-row button.copied {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
    }
    .modal img {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      background: #000;
    }
    .modal-body {
      padding: 1.5rem;
    }
    .modal-body h2 {
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
      color: var(--gold);
    }
    .modal-body .meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .modal-body .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }
    .modal-body .text-block {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem;
      font-size: 0.85rem;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 1rem;
      position: relative;
    }
    .modal-body .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-body .copy-btn.copied { background: var(--success); }
    .modal-body .full-copy {
      width: 100%;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .modal-body .full-copy:hover { background: var(--teal-dark); }
    .modal-body .full-copy.copied { background: var(--success); }

    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .cal-row { grid-template-columns: 1fr; }
      .list-item { grid-template-columns: 80px 1fr; }
      .list-item img { width: 80px; height: 80px; }
      .grid-view { gap: 2px; }
    }
  </style>
</head>
<body>

<div class="hero">

/* ── Helpers ── */
function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const o = btn.textContent;
    btn.textContent = "✓ Copiado";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = o; btn.classList.remove("copied"); }, 1500);
  });
}

function fullText(p) {
  return p.c + "\n\n.\n.\n.\n\n" + p.h;
}

/* ── Views ── */
let currentView = 'grid';

function setView(v) {
  currentView = v;
  document.getElementById('gridView').style.display = v === 'grid' ? 'grid' : 'none';
  document.getElementById('calendarView').style.display = v === 'calendar' ? 'block' : 'none';
  document.getElementById('listView').style.display = v === 'list' ? 'block' : 'none';
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.view-toggle button[onclick="setView('${v}')"]`).classList.add('active');
}

/* ── Modal ── */
function openModal(n) {
  const p = POSTS.find(x => x.n === n);
  if (!p) return;
  const m = document.getElementById('modal');
  m.innerHTML = `
    <div style="position:relative">
      <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('show')">✕</button>
      <img src="instagram/${p.img}" alt="Post ${p.n}">
    </div>
    <div class="modal-body">
      <h2>Post ${p.n} — ${p.t}</h2>
      <p class="meta">Semana ${p.w} · ${p.d}</p>

      <p class="section-label">📝 Caption</p>
      <div class="text-block" id="mc-${p.n}">${p.c}
        <button class="copy-btn" onclick="copyText(document.getElementById('mc-${p.n}').innerText.replace('Copiar','').trim(), this)">Copiar</button>
      </div>

      <p class="section-label">🏷️ Hashtags</p>
      <div class="text-block" id="mh-${p.n}">${p.h}
        <button class="copy-btn" onclick="copyText('${p.h}', this)">Copiar</button>
      </div>

      <button class="full-copy" onclick="copyText(\`${fullText(p).replace(/`/g,"\\`")}\`, this)">📋 Copiar todo (Caption + Hashtags)</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('show');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('show');
});

/* ── Render ── */
function render() {
  // Week pills
  const pills = document.getElementById('weekPills');
  pills.innerHTML = '<button class="active" onclick="scrollToWeek(0, this)">Todas</button>';
  for (let i = 1; i <= 10; i++) {
    pills.innerHTML += `<button onclick="scrollToWeek(${i}, this)">S${i}</button>`;
  }

  // Grid
  const grid = document.getElementById('gridView');
  POSTS.forEach(p => {
    grid.innerHTML += `
      <div class="grid-cell" onclick="openModal(${p.n})">
        <span class="week-label">S${p.w}</span>
        <img src="instagram/${p.img}" alt="Post ${p.n}" loading="lazy">
        <div class="overlay">
          <span class="num">#${p.n}</span>
          <span class="theme">${p.t}</span>
          <span class="day-badge">Sem ${p.w} · ${p.d}</span>
        </div>
      </div>
    `;
  });

  // Calendar
  const cal = document.getElementById('calendarView');
  let cw = 0;
  let rowHtml = '';
  POSTS.forEach((p, i) => {
    if (p.w !== cw) {
      if (rowHtml) cal.innerHTML += rowHtml + '</div></div>';
      cw = p.w;
      rowHtml = `<div class="cal-week" id="week-${cw}">
        <div class="cal-week-header">
          <span class="week-num">SEMANA ${cw}</span>
          <span class="week-title">${['','Lanzamiento','Educativo','Tips prácticos','Confianza','Plataforma','Profesionales','FAQ','Profundidad','Comunidad','Cierre'][cw]}</span>
        </div>
        <div class="cal-row">`;
    }
    const preview = p.c.substring(0, 100) + '...';
    rowHtml += `
      <div class="cal-card" onclick="openModal(${p.n})">
        <img src="instagram/${p.img}" alt="Post ${p.n}" loading="lazy">
        <div class="cal-card-body">
          <div class="cal-card-top">
            <span class="post-num">POST ${p.n}</span>
            <span class="day-tag">${p.d}</span>
          </div>
          <div class="theme-label">${p.t}</div>
          <div class="caption-preview">${preview}</div>
          <div class="btn-row">
            <button onclick="event.stopPropagation(); copyText(\`${fullText(p).replace(/`/g,"\\`")}\`, this)">📋 Copiar todo</button>
          </div>
        </div>
      </div>
    `;
  });
  if (rowHtml) cal.innerHTML += rowHtml + '</div></div>';

  // List
  const list = document.getElementById('listView');
  POSTS.forEach(p => {
    list.innerHTML += `
      <div class="list-item" onclick="openModal(${p.n})">
        <img src="instagram/${p.img}" alt="Post ${p.n}" loading="lazy">
        <div class="list-item-body">
          <div class="list-item-header">
            <span class="num">#${p.n}</span>
            <span class="theme">${p.t}</span>
            <span class="day">Sem ${p.w} · ${p.d}</span>
          </div>
          <div class="caption-text">${p.c}</div>
          <div class="tags-text">${p.h}</div>
          <div class="btn-row">
            <button onclick="event.stopPropagation(); copyText(\`${p.c}\`, this)">📝 Caption</button>
            <button onclick="event.stopPropagation(); copyText('${p.h}', this)">🏷️ Tags</button>
            <button onclick="event.stopPropagation(); copyText(\`${fullText(p).replace(/`/g,"\\`")}\`, this)">📋 Todo</button>
          </div>
        </div>
      </div>
    `;
  });
}

function scrollToWeek(w, btn) {
  document.querySelectorAll('.week-pills button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (w === 0) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (currentView === 'grid') {
    const idx = POSTS.findIndex(p => p.w === w);
    const cells = document.querySelectorAll('.grid-cell');
    if (cells[idx]) cells[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (currentView === 'calendar') {
    const el = document.getElementById(`week-${w}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    const idx = POSTS.findIndex(p => p.w === w);
    const items = document.querySelectorAll('.list-item');
    if (items[idx]) items[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

render();
</script>
